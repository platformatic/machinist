name: Run tests
on: [pull_request, workflow_call, workflow_dispatch]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@v7

    - uses: pnpm/action-setup@v6.0.8
      with:
        version: 12

    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: pnpm install
      uses: nick-fields/retry@v4.0.0
      with:
        max_attempts: 10
        timeout_minutes: 5
        retry_on: error
        command: pnpm install

    - name: Run linter
      run: pnpm lint

    - name: Create cluster
      uses: AbsaOSS/k3d-action@v2
      with:
        cluster-name: plt-machinist-test
        k3d-version: v5.8.3

    - name: Install Gateway API CRDs
      run: pnpm --filter machinist test:install-crds

    - name: Build and import test image
      run: |
        pnpm --filter machinist test:build-image
        pnpm --filter machinist test:import-image

    - name: Run test suite
      run: pnpm test:unit

    # The ECS provider's routing is asserted against an emulated ALB rather than
    # against SDK stubs, so the emulator has to be up before the suite runs. It
    # fails rather than skips when it is missing, which is the point.
    - name: Start the AWS emulator
      run: pnpm --filter machinist test:compose-up

    - name: Run ECS/ALB end-to-end suite
      run: pnpm --filter machinist test:e2e:ecs

    - name: Stop the AWS emulator
      if: always()
      run: pnpm --filter machinist test:compose-down
